<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>abidlink</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .header-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .badge {
      background-color: #1a1a1a;
      border: 1px solid #333;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
    }

    .badge span {
      color: #ffaa00;
      font-weight: bold;
      display: block;
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-text h1 {
      font-size: 22px;
      color: #ff7700;
      font-weight: bold;
    }

    .title-text p {
      font-size: 11px;
      color: #888;
    }

    .logo-icon {
      background: #ff7700;
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .main-card {
      background-color: #161618;
      border: 1px solid #28282b;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .main-title {
      font-size: 18px;
      text-align: center;
      margin-bottom: 8px;
    }

    .sub-title {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-bottom: 20px;
    }

    .upload-box {
      border: 2px dashed #333;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      background-color: #111;
      cursor: pointer;
      transition: 0.3s;
    }

    .upload-box:hover {
      border-color: #ff7700;
    }

    .upload-icon {
      font-size: 48px;
      color: #ff7700;
      margin-bottom: 12px;
    }

    .upload-text {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .upload-subtext {
      font-size: 12px;
      color: #666;
    }

    .file-list {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-item {
      background-color: #1e1e21;
      border: 1px solid #2a2a2e;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .file-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      width: 100%;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ccc;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 75%;
    }

    .thumb-mini {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
      cursor: pointer;
      border: 1px solid #333;
      transition: transform 0.2s;
    }

    .thumb-mini:hover {
      transform: scale(1.1);
    }

    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      color: #666;
      font-size: 11px;
    }

    .btn-delete {
      color: #ff4d4d;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }

    .progress-bar-container {
      width: 100%;
      height: 5px;
      background-color: #111;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: #25c960;
      transition: width 0.1s linear;
    }

    .btn-submit {
      width: 100%;
      background-color: #ff7700;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }

    .btn-submit:hover {
      background-color: #e66a00;
    }

    .results-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .result-card {
      background-color: #121214;
      border: 1px solid #28282b;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .card-delete-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      color: #ff4d4d;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      transition: transform 0.2s, color 0.2s;
    }

    .card-delete-btn:hover {
      color: #ff1a1a;
      transform: scale(1.1);
    }

    .result-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-right: 25px;
    }

    .result-preview img {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #333;
      cursor: pointer;
    }

    .result-preview-info p {
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .link-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .link-label {
      font-size: 10px;
      color: #ffaa00;
      font-weight: bold;
      text-transform: uppercase;
    }

    .link-box {
      display: flex;
      background-color: #1a1a1d;
      border: 1px solid #2a2a2e;
      border-radius: 6px;
      padding: 4px 6px;
      align-items: center;
      justify-content: space-between;
    }

    .link-input {
      background: transparent;
      border: none;
      color: #25c960;
      width: 75%;
      font-size: 11px;
      outline: none;
      font-family: monospace;
    }

    .btn-copy {
      background-color: #ff7700;
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      min-width: 60px;
    }

    .btn-copy.copied {
      background-color: #25c960 !important;
      color: #ffffff !important;
    }

    .status-msg {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      color: #ffaa00;
      display: none;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background-color: #1a1a1d;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      max-width: 90%;
      max-height: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .modal-content img {
      max-width: 100%;
      max-height: 60vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .modal-actions {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
    }

    .btn-modal-delete {
      background-color: #ff4d4d;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .btn-modal-close {
      background-color: #333;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #555;
      text-align: center;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title-area">
      <div class="logo-icon">
        <i class="fa-solid fa-cloud-arrow-up"></i>
      </div>
      <div class="title-text">
        <h1>abidlink</h1>
        <p>Upload and convert images to instant direct links</p>
      </div>
    </div>
    <div class="badge">
      ⚡ FREE
      <span>100%</span>
    </div>
  </div>

  <div class="main-card">
    <h2 class="main-title">Select images to upload (Up to 10 images)</h2>
    <p class="sub-title">Please select files from your device</p>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">
        <i class="fa-solid fa-image"></i>
      </div>
      <div class="upload-text">Click here to select images</div>
      <div class="upload-subtext">You can select multiple images (Max 10 images)</div>
    </div>

    <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFiles(this.files)">

    <div class="file-list" id="fileList"></div>

    <button class="btn-submit" id="uploadBtn" onclick="uploadFiles()">
      <i class="fa-solid fa-cloud-arrow-up"></i>
      [ Upload Files ]
    </button>

    <div class="status-msg" id="statusMsg">Uploading... Please wait.</div>

    <div class="results-container" id="resultsContainer"></div>
  </div>

  <div class="modal-overlay" id="imageModal">
    <div class="modal-content">
      <img id="modalImg" src="" alt="Enlarged preview">
      <div class="modal-actions">
        <button class="btn-modal-delete" id="modalDeleteBtn">
          <i class="fa-solid fa-trash"></i> Delete
        </button>
        <button class="btn-modal-close" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <div class="footer">
    All rights reserved © abidlink
  </div>

  <script>
    let selectedFiles = [];
    let currentPreviewIndex = null;
    let isUploadedState = false;

    function handleFiles(files) {
      const newFiles = Array.from(files);

      if (selectedFiles.length + newFiles.length > 10) {
        alert("Maximum limit is 10 images");
        return;
      }

      newFiles.forEach(file => {
        selectedFiles.push({
          file: file,
          loaded: false,
          progress: 0,
          previewUrl: URL.createObjectURL(file)
        });
      });

      renderFiles();
      simulateProgress();
    }

    function renderFiles() {
      const fileList = document.getElementById('fileList');
      fileList.innerHTML = '';

      selectedFiles.forEach((item, index) => {
        const file = item.file;
        const sizeInMB = (file.size / (1024 * 1024)).toFixed(2);
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';

        const iconOrThumb = item.loaded
          ? `<img src="${item.previewUrl}" class="thumb-mini" onclick="openModal(${index})" alt="thumb">`
          : `<i class="fa-regular fa-image" style="color: #ffaa00; font-size: 18px;"></i>`;

        fileItem.innerHTML = `
          <div class="file-item-header">
            <div class="file-info">
              ${iconOrThumb}
              <span class="file-name">${file.name}</span>
              <span class="file-size">(${sizeInMB} MB)</span>
            </div>
            <div class="btn-delete" onclick="removeFile(${index})">
              <i class="fa-solid fa-trash"></i> Delete
            </div>
          </div>
          ${!item.loaded ? `
          <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: ${item.progress}%;"></div>
          </div>` : ''}
        `;
        fileList.appendChild(fileItem);
      });
    }

    function simulateProgress() {
      selectedFiles.forEach((item, index) => {
        if (!item.loaded) {
          let interval = setInterval(() => {
            if (item.progress >= 100) {
              item.loaded = true;
              item.progress = 100;
              clearInterval(interval);
              renderFiles();
            } else {
              item.progress += 20;
              renderFiles();
            }
          }, 100);
        }
      });
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      renderFiles();
      closeModal();
    }

    function openModal(index) {
      currentPreviewIndex = index;
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      const modalDeleteBtn = document.getElementById('modalDeleteBtn');

      modalImg.src = selectedFiles[index].previewUrl;
      modalDeleteBtn.style.display = 'flex';
      modalDeleteBtn.onclick = () => removeFile(index);
      
      modal.style.display = 'flex';
      history.pushState({ modalOpen: true }, "");
    }

    function closeModal() {
      const modal = document.getElementById('imageModal');
      if (modal.style.display === 'flex') {
        modal.style.display = 'none';
        currentPreviewIndex = null;
      }
    }

    async function uploadFiles() {
      if (selectedFiles.length === 0) {
        alert("Please select images first!");
        return;
      }

      const statusMsg = document.getElementById('statusMsg');
      const uploadBtn = document.getElementById('uploadBtn');

      statusMsg.style.display = 'block';
      statusMsg.innerText = "Uploading images... Please wait.";
      uploadBtn.disabled = true;
      uploadBtn.style.opacity = "0.5";

      const API_KEY = "c86940a02cbdbfa2bd82dc211910d5ec"; 

      for (let i = 0; i < selectedFiles.length; i++) {
        let item = selectedFiles[i];
        let file = item.file;
        let formData = new FormData();
        formData.append("image", file);

        try {
          let response = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
            method: "POST",
            body: formData
          });

          let result = await response.json();
          if (result.success) {
            let directUrl = result.data.url;
            let htmlCode = `<img src="${directUrl}" alt="${file.name}">`;
            addResultCard(file.name, item.previewUrl, directUrl, htmlCode);
          } else {
            alert("Upload error for: " + file.name);
          }
        } catch (error) {
          console.error("Upload Error:", error);
          alert("Network error while uploading: " + file.name);
        }
      }

      statusMsg.innerText = "Upload completed successfully!";
      uploadBtn.disabled = false;
      uploadBtn.style.opacity = "1";
      selectedFiles = [];
      renderFiles();

      if (!isUploadedState) {
        history.pushState({ uploaded: true }, "");
        isUploadedState = true;
      }
    }

    function addResultCard(fileName, imgSrc, pngUrl, htmlCode) {
      const resultsContainer = document.getElementById('resultsContainer');
      const card = document.createElement('div');
      card.className = 'result-card';
      
      card.innerHTML = `
        <div class="card-delete-btn" onclick="removeCard(this)" title="Delete">
          <i class="fa-solid fa-trash"></i>
        </div>

        <div class="result-preview">
          <img src="${imgSrc}" onclick="openResultModal('${imgSrc}')" alt="Preview">
          <div class="result-preview-info">
            <p>${fileName}</p>
          </div>
        </div>

        <div class="link-group">
          <span class="link-label">Direct Link</span>
          <div class="link-box">
            <input type="text" class="link-input" value="${pngUrl}" readonly>
            <button class="btn-copy" onclick="copyText(this)">Copy</button>
          </div>
        </div>

        <div class="link-group">
          <span class="link-label">HTML Code</span>
          <div class="link-box">
            <input type="text" class="link-input" value="${htmlCode.replace(/"/g, '&quot;')}" readonly>
            <button class="btn-copy" onclick="copyText(this)">Copy</button>
          </div>
        </div>
      `;

      resultsContainer.appendChild(card);
    }

    function openResultModal(imgSrc) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      const modalDeleteBtn = document.getElementById('modalDeleteBtn');

      modalImg.src = imgSrc;
      modalDeleteBtn.style.display = 'none';
      modal.style.display = 'flex';
      history.pushState({ modalOpen: true }, "");
    }

    function removeCard(btn) {
      const card = btn.closest('.result-card');
      card.remove();
    }

    function copyText(btn) {
      const input = btn.previousElementSibling;
      navigator.clipboard.writeText(input.value).then(() => {
        btn.innerText = "Copied!";
        btn.classList.add("copied");

        setTimeout(() => {
          btn.innerText = "Copy";
          btn.classList.remove("copied");
        }, 2000);
      });
    }

    function resetApp() {
      document.getElementById('resultsContainer').innerHTML = '';
      document.getElementById('statusMsg').style.display = 'none';
      document.getElementById('fileInput').value = '';
      selectedFiles = [];
      renderFiles();
      isUploadedState = false;
    }

    window.addEventListener('popstate', function(e) {
      const modal = document.getElementById('imageModal');
      
      if (modal.style.display === 'flex') {
        closeModal();
        return;
      }

      if (isUploadedState) {
        resetApp();
      }
    });
  </script>

</body>
</html>
