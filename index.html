<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>abidlink</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f0f11;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #18181c;
      padding: 20px;
      border-radius: 12px;
      border: 1px dashed #ff7b00;
    }
    .upload-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      margin-bottom: 15px;
    }
    .btn {
      border: 2px solid #ff7b00;
      color: white;
      background-color: #ff7b00;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .file-input {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
    }
    .file-list {
      text-align: right;
      margin-top: 15px;
    }
    .file-item {
      background: #25252b;
      padding: 8px 12px;
      margin: 5px 0;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
      color: #ff4d4d;
      cursor: pointer;
      font-weight: bold;
    }
    .links-container {
      margin-top: 20px;
      text-align: right;
    }
    .link-item {
      background: #1e293b;
      padding: 10px;
      border-radius: 6px;
      margin-top: 8px;
      word-break: break-all;
    }
    .link-item a {
      color: #38bdf8;
      text-decoration: none;
    }
    #status {
      margin-top: 15px;
      color: #ffb700;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>abidlink</h2>
  <p>رفع وتحويل الصور إلى روابط مباشرة</p>

  <div class="container">
    <h3>إضافة صور (حتى 10 صور)</h3>
    
    <div class="upload-btn-wrapper">
      <button class="btn">اختر صورة +</button>
      <input type="file" id="imageInput" accept="image/*" class="file-input" onchange="addFile(this)">
    </div>

    <div id="fileList" class="file-list"></div>

    <button id="uploadBtn" class="btn" style="background-color: #e66e00; margin-top: 15px; display: none;" onclick="uploadAllImages()">
      ⚡ رفع الصور الآن
    </button>

    <div id="status"></div>
    <div id="links" class="links-container"></div>
  </div>

  <script>
    let selectedFiles = [];

    // إضافة ملف للقائمة عند الاختيار
    function addFile(input) {
      if (input.files && input.files[0]) {
        if (selectedFiles.length >= 10) {
          alert("يمكنك اختيار 10 صور كحد أقصى!");
          return;
        }

        const file = input.files[0];
        selectedFiles.push(file);
        renderFileList();

        // إعادة تعيين المدخل لاختيار ملف آخر
        input.value = '';
      }
    }

    // عرض قائمة الملفات المختارة
    function renderFileList() {
      const fileListContainer = document.getElementById('fileList');
      const uploadBtn = document.getElementById('uploadBtn');
      fileListContainer.innerHTML = '';

      selectedFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
          <span>🖼️ ${file.name} (${(file.size / 1024).toFixed(1)} KB)</span>
          <span class="delete-btn" onclick="removeFile(${index})">❌ حذف</span>
        `;
        fileListContainer.appendChild(item);
      });

      if (selectedFiles.length > 0) {
        uploadBtn.style.display = 'block';
      } else {
        uploadBtn.style.display = 'none';
      }
    }

    // حذف ملف من القائمة
    function removeFile(index) {
      selectedFiles.splice(index, 1);
      renderFileList();
    }

    // رفع الصور ببرمجة دقيقة ومصححة تتجاوز مشاكل الرفع السابقة
    async function uploadAllImages() {
      if (selectedFiles.length === 0) return;

      const status = document.getElementById('status');
      const linksContainer = document.getElementById('links');
      status.innerText = "جاري رفع الصور... يرجى الانتظار ⏳";
      linksContainer.innerHTML = '';

      // استخدام مفتاح ImgBB موثوق مع ضبط الحقل الصحيح باسم image
      const apiKey = '2d284364a852a39281a8c54572213e9a';

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        const formData = new FormData();
        formData.append('image', file); // تم تصحيح الحقل ليكون 'image' حصرياً

        try {
          status.innerText = `جاري رفع الصورة (${i + 1}/${selectedFiles.length})...`;
          
          const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
            method: 'POST',
            body: formData
          });

          const data = await response.json();

          if (data && data.success && data.data && data.data.url) {
            const imageUrl = data.data.url;
            const linkBox = document.createElement('div');
            linkBox.className = 'link-item';
            linkBox.innerHTML = `
              <strong>الصورة ${i + 1}:</strong><br>
              <a href="${imageUrl}" target="_blank">${imageUrl}</a>
            `;
            linksContainer.appendChild(linkBox);
          } else {
            throw new Error(data.error?.message || 'فشل الرفع من السيرفر');
          }
        } catch (error) {
          console.error(error);
          const errorBox = document.createElement('div');
          errorBox.className = 'link-item';
          errorBox.style.color = '#ff4d4d';
          errorBox.innerText = `❌ فشل رفع الصورة: ${file.name}`;
          linksContainer.appendChild(errorBox);
        }
      }

      status.innerText = "✅ اكتمل الرفع بنجاح!";
      selectedFiles = [];
      renderFileList();
    }
  </script>
</body>
</html>
