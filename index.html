<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>abidlink</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .header-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .badge {
      background-color: #1a1a1a;
      border: 1px solid #333;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
    }

    .badge span {
      color: #ffaa00;
      font-weight: bold;
      display: block;
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-text h1 {
      font-size: 22px;
      color: #ff7700;
      font-weight: bold;
    }

    .title-text p {
      font-size: 11px;
      color: #888;
    }

    .logo-icon {
      background: #ff7700;
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .main-card {
      background-color: #161618;
      border: 1px solid #28282b;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .main-title {
      font-size: 18px;
      text-align: center;
      margin-bottom: 8px;
    }

    .sub-title {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-bottom: 20px;
    }

    .upload-box {
      border: 2px dashed #333;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      background-color: #111;
      cursor: pointer;
      transition: 0.3s;
    }

    .upload-box:hover {
      border-color: #ff7700;
    }

    .upload-icon {
      font-size: 48px;
      color: #ff7700;
      margin-bottom: 12px;
    }

    .upload-text {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .upload-subtext {
      font-size: 12px;
      color: #666;
    }

    .file-list {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-item {
      background-color: #1e1e21;
      border: 1px solid #2a2a2e;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      width: 100%;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ccc;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 75%;
    }

    .thumb-mini {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
      cursor: pointer;
      border: 1px solid #333;
    }

    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      color: #666;
      font-size: 11px;
    }

    .btn-delete {
      color: #ff4d4d;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }

    .btn-submit {
      width: 100%;
      background-color: #ff7700;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }

    .btn-submit:hover {
      background-color: #e66a00;
    }

    .status-msg {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      color: #ffaa00;
      display: none;
    }

    .results-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .result-card {
      background-color: #121214;
      border: 1px solid #28282b;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .card-delete-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      color: #ff4d4d;
      cursor: pointer;
      font-size: 16px;
    }

    .result-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-right: 25px;
    }

    .result-preview img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .result-preview-info p {
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    .link-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .link-label {
      font-size: 11px;
      color: #ffaa00;
      font-weight: bold;
      text-transform: uppercase;
    }

    .link-box {
      display: flex;
      background-color: #1a1a1d;
      border: 1px solid #2a2a2e;
      border-radius: 6px;
      padding: 4px 6px;
      align-items: center;
      justify-content: space-between;
    }

    .link-input {
      background: transparent;
      border: none;
      color: #25c960;
      width: 75%;
      font-size: 11px;
      outline: none;
      font-family: monospace;
    }

    .btn-copy {
      background-color: #ff7700;
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-copy.copied {
      background-color: #25c960 !important;
      color: #ffffff !important;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background-color: #1a1a1d;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      max-width: 90%;
      max-height: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .modal-content img {
      max-width: 100%;
      max-height: 60vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .btn-modal-close {
      background-color: #333;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #555;
      text-align: center;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title-area">
      <div class="logo-icon">
        <i class="fa-solid fa-cloud-arrow-up"></i>
      </div>
      <div class="title-text">
        <h1>abidlink</h1>
        <p>Fast image uploader & direct links</p>
      </div>
    </div>
    <div class="badge">
      ⚡ FREE
      <span>100%</span>
    </div>
  </div>

  <div class="main-card">
    <h2 class="main-title">Select images to upload</h2>
    <p class="sub-title">Supports PNG, JPG, GIF, WEBP</p>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">
        <i class="fa-solid fa-image"></i>
      </div>
      <div class="upload-text">Click here to select images</div>
      <div class="upload-subtext">Multiple selection supported</div>
    </div>

    <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFiles(this.files)">

    <div class="file-list" id="fileList"></div>

    <button class="btn-submit" id="uploadBtn" onclick="uploadFiles()">
      <i class="fa-solid fa-cloud-arrow-up"></i>
      [ Upload Files ]
    </button>

    <div class="status-msg" id="statusMsg">Uploading... Please wait.</div>

    <div class="results-container" id="resultsContainer"></div>
  </div>

  <div class="modal-overlay" id="imageModal">
    <div class="modal-content">
      <img id="modalImg" src="" alt="Preview">
      <button class="btn-modal-close" onclick="closeModal()">Close</button>
    </div>
  </div>

  <div class="footer">
    All rights reserved © abidlink
  </div>

  <script>
    let selectedFiles = [];

    function handleFiles(files) {
      const newFiles = Array.from(files);
      newFiles.forEach(file => {
        selectedFiles.push({
          file: file,
          previewUrl: URL.createObjectURL(file)
        });
      });
      renderFiles();
    }

    function renderFiles() {
      const fileList = document.getElementById('fileList');
      fileList.innerHTML = '';

      selectedFiles.forEach((item, index) => {
        const file = item.file;
        const sizeInMB = (file.size / (1024 * 1024)).data ? 0 : (file.size / (1024 * 1024)).toFixed(2);
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';

        fileItem.innerHTML = `
          <div class="file-item-header">
            <div class="file-info">
              <img src="${item.previewUrl}" class="thumb-mini" onclick="openModal('${item.previewUrl}')" alt="thumb">
              <span class="file-name">${file.name}</span>
              <span class="file-size">(${sizeInMB} MB)</span>
            </div>
            <div class="btn-delete" onclick="removeFile(${index})">
              <i class="fa-solid fa-trash"></i> Delete
            </div>
          </div>
        `;
        fileList.appendChild(fileItem);
      });
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      renderFiles();
    }

    function openModal(url) {
      document.getElementById('modalImg').src = url;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    // الرفع عبر سيرفر Catbox.moe (ما كيديرش مشاكل CORS وكيقبل أي ملفات مباشرة)
    async function uploadSingleFile(file) {
      try {
        let formData = new FormData();
        formData.append("reqtype", "fileupload");
        formData.append("fileToUpload", file);

        let response = await fetch("https://catbox.moe/user/api.php", {
          method: "POST",
          body: formData
        });

        let directUrl = await response.text();
        if (directUrl && directUrl.startsWith("http")) {
          return directUrl.trim();
        }
      } catch (err) {
        console.error("Upload Error:", err);
      }
      return null;
    }

    async function uploadFiles() {
      if (selectedFiles.length === 0) {
        alert("Please select images first!");
        return;
      }

      const statusMsg = document.getElementById('statusMsg');
      const uploadBtn = document.getElementById('uploadBtn');

      statusMsg.style.display = 'block';
      statusMsg.innerText = "Uploading images... Please wait.";
      uploadBtn.disabled = true;
      uploadBtn.style.opacity = "0.5";

      for (let i = 0; i < selectedFiles.length; i++) {
        let item = selectedFiles[i];
        let file = item.file;

        let directUrl = await uploadSingleFile(file);

        if (directUrl) {
          let htmlCode = `<img src="${directUrl}" alt="${file.name}">`;
          addResultCard(file.name, item.previewUrl, directUrl, htmlCode);
        } else {
          alert("Upload failed for: " + file.name);
        }
      }

      statusMsg.style.display = 'none';
      uploadBtn.disabled = false;
      uploadBtn.style.opacity = "1";
      selectedFiles = [];
      renderFiles();
    }

    function addResultCard(fileName, imgSrc, directUrl, htmlCode) {
      const resultsContainer = document.getElementById('resultsContainer');
      const card = document.createElement('div');
      card.className = 'result-card';
      
      card.innerHTML = `
        <div class="card-delete-btn" onclick="this.closest('.result-card').remove()" title="Delete">
          <i class="fa-solid fa-trash"></i>
        </div>

        <div class="result-preview">
          <img src="${imgSrc}" onclick="openModal('${imgSrc}')" alt="Preview">
          <div class="result-preview-info">
            <p>${fileName}</p>
          </div>
        </div>

        <div class="link-group">
          <span class="link-label">Direct Link</span>
          <div class="link-box">
            <input type="text" class="link-input" value="${directUrl}" readonly>
            <button class="btn-copy" onclick="copyText(this)">Copy</button>
          </div>
        </div>

        <div class="link-group">
          <span class="link-label">HTML Link</span>
          <div class="link-box">
            <input type="text" class="link-input" value="${htmlCode.replace(/"/g, '&quot;')}" readonly>
            <button class="btn-copy" onclick="copyText(this)">Copy</button>
          </div>
        </div>
      `;

      resultsContainer.appendChild(card);
    }

    function copyText(btn) {
      const input = btn.previousElementSibling;
      
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(input.value).then(() => showCopied(btn));
      } else {
        input.select();
        document.execCommand('copy');
        showCopied(btn);
      }
    }

    function showCopied(btn) {
      btn.innerText = "Copied!";
      btn.classList.add("copied");

      setTimeout(() => {
        btn.innerText = "Copy";
        btn.classList.remove("copied");
      }, 2000);
    }
  </script>

</body>
</html>
