<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>abidlink - اختصار الروابط و QR Code</title>
  <!-- استدعاء مكتبة توليد الـ QR Code السريعة -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f0f11;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: 30px auto;
      background: #18181c;
      padding: 25px;
      border-radius: 12px;
      border: 1px dashed #ff7b00;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    h2 {
      color: #ff7b00;
      margin-bottom: 5px;
    }
    p {
      color: #a1a1aa;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: right;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }
    .text-input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background-color: #25252b;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
    }
    .text-input:focus {
      border-color: #ff7b00;
    }
    .btn {
      border: 2px solid #ff7b00;
      color: white;
      background-color: #ff7b00;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #e66e00;
    }
    .result-container {
      margin-top: 25px;
      display: none;
      background: #1e293b;
      padding: 15px;
      border-radius: 8px;
      text-align: right;
    }
    .result-item {
      margin-bottom: 15px;
    }
    .result-item a {
      color: #38bdf8;
      text-decoration: none;
      word-break: break-all;
      font-weight: bold;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin: 15px 0;
      background: white;
      padding: 10px;
      border-radius: 8px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }
    .footer {
      margin-top: 30px;
      color: #71717a;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <h2>abidlink</h2>
  <p>أداة اختصار الروابط وتوليد رموز الاستجابة السريعة (QR Code)</p>

  <div class="container">
    <div class="input-group">
      <label for="longUrl">أدخل الرابط الطويل هنا:</label>
      <input type="url" id="longUrl" class="text-input" placeholder="https://example.com">
    </div>

    <button class="btn" onclick="generateTools()">⚡ توليد الرابط و QR Code</button>

    <div id="resultBox" class="result-container">
      <div class="result-item">
        <strong>الرابط المختصر (محاكي):</strong><br>
        <a id="shortLinkDisplay" href="#" target="_blank"></a>
      </div>

      <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">

      <div style="text-align: center;">
        <strong>رمز الاستجابة السريعة (QR Code):</strong>
        <div id="qrcode"></div>
        <button class="btn" style="background-color: #2563eb; border-color: #2563eb; font-size: 14px; padding: 8px 16px; width: auto;" onclick="downloadQR()">📥 تحميل صورة QR</button>
      </div>
    </div>
  </div>

  <div class="footer">
    All rights reserved © abidlink
  </div>

  <script>
    function generateTools() {
      const urlInput = document.getElementById('longUrl').value.trim();
      const resultBox = document.getElementById('resultBox');
      const shortLinkDisplay = document.getElementById('shortLinkDisplay');
      const qrcodeContainer = document.getElementById('qrcode');

      if (!urlInput) {
        alert("المرجو إدخال رابط صحيح أولاً!");
        return;
      }

      // التأكد من أن الرابط يبدأ بـ http أو https
      let validUrl = urlInput;
      if (!validUrl.startsWith('http://') && !validUrl.startsWith('https://')) {
        validUrl = 'https://' + validUrl;
      }

      // إظهار صندوق النتائج
      resultBox.style.display = 'block';

      // محاكاة اختصار الرابط (باستخدام رابط الموقع مع معرف عشوائي أو الرابط الأصلي)
      const randomCode = Math.random().toString(36.substring(2, 8));
      const shortUrl = window.location.origin + window.location.pathname + "#" + randomCode;
      
      shortLinkDisplay.href = validUrl;
      shortLinkDisplay.innerText = validUrl; // يمكنك استبدالها بـ shortUrl لو أردت رابطاً مختصراً

      // تفريغ الـ QR القديم إن وُجد وتوليد واحد جديد
      qrcodeContainer.innerHTML = "";
      
      new QRCode(qrcodeContainer, {
        text: validUrl,
        width: 160,
        height: 160,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });
    }

    // دالة لتحميل صورة الـ QR الناتجة
    function downloadQR() {
      const qrImage = document.querySelector('#qrcode img') || document.querySelector('#qrcode canvas');
      if (!qrImage) {
        alert("لم يتم العثور على رمز QR لتحميله!");
        return;
      }

      let imageUrl = "";
      if (qrImage.tagName === "CANVAS") {
        imageUrl = qrImage.toDataURL("image/png");
      } else if (qrImage.tagName === "IMG") {
        imageUrl = qrImage.src;
      }

      const downloadLink = document.createElement('a');
      downloadLink.href = imageUrl;
      downloadLink.download = 'abidlink-qrcode.png';
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }
  </script>
</body>
</html>
